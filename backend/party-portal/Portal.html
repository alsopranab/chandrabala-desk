<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:15px system-ui;margin:0;background:#f5f5fb;color:#25243b}header{background:#5146a8;color:white;padding:20px}main{max-width:900px;margin:auto;padding:15px}.card{background:white;border:1px solid #e5e4ef;border-radius:16px;padding:18px;margin:14px 0}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font:inherit}button{background:#6254d5;color:white;border:0;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bill{border:1px solid #e4e4ee;border-radius:12px;padding:14px;margin:10px 0}.actions{display:flex;gap:8px}.actions button{flex:1}.hidden{display:none}.status{padding:4px 9px;border-radius:20px;background:#f5e8c5;font-size:12px}.APPROVED{background:#d9f4e2}.REJECTED{background:#fbdede}small{color:#6d6c7d}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><h2>Chandrabala Party Portal</h2>Bill submission & review</header><main><section id="login" class="card"><h3>Sign in</h3><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="signIn()">Sign in</button><p id="msg"></p></section><section id="app" class="hidden"><div class="card"><button onclick="signOut()">Sign out</button><h3 id="welcome"></h3></div><div id="party" class="hidden"><div class="card"><h3>Submit bill</h3><div class="grid"><input id="bn" placeholder="Bill number"><input id="date" type="date"><input id="amt" type="number" placeholder="Amount ₹"><input id="attachment" type="file" accept=".pdf,.jpg,.jpeg,.png"></div><textarea id="notes" placeholder="Notes"></textarea><button onclick="sendBill()">Submit for review</button><p id="sendmsg"></p></div><div class="card"><h3>Submission history</h3><div id="mine"></div></div></div><div id="admin" class="hidden"><div class="card"><h3>Create party account</h3><div class="grid"><input id="name" placeholder="Party name"><select id="type"><option>SUPPLIER</option><option>CUSTOMER</option><option>BOTH</option></select><input id="newemail" type="email" placeholder="Email"><input id="phone" placeholder="Phone"><input id="newpass" type="password" placeholder="Temporary password (12+ chars)"></div><button onclick="addParty()">Create</button><p id="createMsg"></p></div><div class="card"><h3>Bill review</h3><select id="filter" onchange="loadReview()"><option>PENDING</option><option>APPROVED</option><option>REJECTED</option><option value="">All</option></select><div id="reviews"></div></div><div class="card"><h3>Party accounts</h3><div id="partylist"></div></div></div></section></main><script>let T='',R='';function signIn(){google.script.run.withSuccessHandler(x=>{T=x.token;R=x.role;login.classList.add('hidden');app.classList.remove('hidden');welcome.textContent='Welcome '+x.name;(R==='ADMIN'?admin:party).classList.remove('hidden');R==='ADMIN'?loadReview():loadMine();}).withFailureHandler(e=>msg.textContent=e.message).login(email.value,password.value)}function signOut(){google.script.run.logout(T);T='';app.classList.add('hidden');login.classList.remove('hidden');admin.classList.add('hidden');party.classList.add('hidden')}function loadMine(){google.script.run.withSuccessHandler(renderMine).withFailureHandler(e=>mine.textContent=e.message).myBills(T)}function renderMine(rows){mine.innerHTML='';if(!rows.length){mine.textContent='No submissions yet';return}rows.reverse().forEach(x=>mine.append(card(x,false)))}function sendBill(){let f=attachment.files[0];if(!f||f.size>8*1024*1024){sendmsg.textContent='Choose a PDF/JPG/PNG up to 8 MB';return}let rd=new FileReader();rd.onload=()=>google.script.run.withSuccessHandler(()=>{sendmsg.textContent='Submitted. Pending bills do not alter stock or accounts.';bn.value=amt.value=notes.value='';attachment.value='';loadMine()}).withFailureHandler(e=>sendmsg.textContent=e.message).submit(T,{billNo:bn.value,date:date.value,amount:amt.value,notes:notes.value,fileName:f.name,mime:f.type,data:rd.result.split(',')[1]});rd.readAsDataURL(f)}function loadReview(){google.script.run.withSuccessHandler(rows=>{reviews.innerHTML='';if(!rows.length){reviews.textContent='No submissions';return}rows.reverse().forEach(x=>reviews.append(card(x,true)))}).withFailureHandler(e=>reviews.textContent=e.message).adminBills(T,filter.value);google.script.run.withSuccessHandler(renderParties).listParties(T)}function card(x,isAdmin){let d=document.createElement('div');d.className='bill';d.innerHTML='<b>'+esc(x.partyName)+' — '+esc(x.billNo)+'</b><p> '+esc(x.date)+' · ₹'+Number(x.amount).toLocaleString('en-IN')+'</p><span class="status '+x.status+'">'+x.status+'</span><p><small>'+esc(x.fileName)+'</small></p><p>'+esc(x.notes||'')+'</p>';let v=document.createElement('button');v.textContent='Download attachment';v.onclick=()=>google.script.run.withSuccessHandler(f=>{let a=document.createElement('a');a.href='data:'+f.mime+';base64,'+f.data;a.download=f.name;a.click()}).withFailureHandler(e=>alert(e.message)).file(T,x.id);d.append(v);if(x.remarks)d.insertAdjacentHTML('beforeend','<p><b>Remarks:</b> '+esc(x.remarks)+'</p>');if(isAdmin&&x.status==='PENDING'){let ta=document.createElement('textarea');ta.placeholder='Rejection reason/remarks';d.append(ta);let buttons=document.createElement('div');buttons.className='actions';['APPROVED','REJECTED'].forEach(s=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>google.script.run.withSuccessHandler(loadReview).withFailureHandler(e=>alert(e.message)).review(T,x.id,s,ta.value);buttons.append(b)});d.append(buttons)}return d}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function addParty(){google.script.run.withSuccessHandler(()=>{createMsg.textContent='Account created. Share credentials privately.';name.value=newemail.value=phone.value=newpass.value='';loadReview()}).withFailureHandler(e=>createMsg.textContent=e.message).createParty(T,{name:name.value,type:type.value,email:newemail.value,phone:phone.value,password:newpass.value})}function renderParties(rows){partylist.innerHTML='';rows.forEach(x=>{let d=document.createElement('div');d.className='bill';d.innerHTML='<b>'+esc(x.name)+'</b> · '+x.type+'<small><p>'+esc(x.email)+' · '+(x.active?'Active':'Disabled')+'</p></small>';let b=document.createElement('button');b.textContent=x.active?'Disable':'Enable';b.onclick=()=>google.script.run.withSuccessHandler(loadReview).toggleParty(T,x.id,!x.active);d.append(b);partylist.append(d)})}</script></body></html>
