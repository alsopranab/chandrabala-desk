<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6966b9"><meta name="description" content="Chandrabala Desk — rubber trading operations, invoices and inventory."><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=4"><title>Chandrabala Desk</title></head><body><aside><div class="brand"><img src="assets/logo.svg" alt="Chandrabala"><div><b>CHANDRABALA</b><small>RUBBER INDUSTRIES</small></div></div><nav aria-label="Main navigation"><button data-view="home">Overview</button><button data-view="sales">Sales & invoices</button><button data-view="purchase">Purchases</button><button data-view="stock">Inventory</button><button data-view="parties">Parties</button><button data-view="settings">Settings</button></nav><div class="asidefoot">Trading operations desk</div></aside><main><header><div><h1 id="heading">Overview</h1><p id="subheading">Manage your transactions and inventory.</p></div><button id="new">+ New transaction</button></header><div id="app"></div></main><dialog id="dlg"><form id="form"><h2 id="formtitle">New transaction</h2><input type="hidden" name="editid"><label>Type<select name="type"><option value="sale">Sale</option><option value="purchase">Purchase</option></select></label><label>Date<input type="date" name="date" required></label><label>Party name<input name="party" required autocomplete="off"></label><label>WhatsApp number (optional)<input name="phone" placeholder="Country code + number"></label><label>Grade<select name="grade"><option>RSS 4</option><option>RSS 5</option><option>Dry Lot</option><option>Good Lot</option><option>Washing Lot</option></select></label><label>Quantity (kg)<input type="number" step=".01" min=".01" name="qty" required></label><label>Rate ₹/kg<input type="number" step=".01" min="0" name="rate" required></label><label>GST %<select name="gst"><option>0</option><option>5</option><option>12</option><option>18</option></select></label><label>Payment status<select name="status"><option value="pending">Pending</option><option value="paid">Paid</option><option value="partial">Partially paid</option></select></label><label>Amount paid ₹ (optional)<input type="number" step=".01" min="0" name="paid"></label><label>Notes<input name="notes"></label><p id="calc">Total: ₹0.00</p><div class="actions"><button type="submit">Save transaction</button><button type="button" class="alt" id="close">Cancel</button></div></form></dialog><dialog id="detail"><div id="detailbody"></div><button class="alt" id="detailclose">Close</button></dialog><dialog id="partyDlg"><form id="partyForm"><h2>Add party</h2><label>Name<input name="name" required></label><label>Phone / WhatsApp<input name="phone"></label><label>Type<select name="type"><option>Customer</option><option>Supplier</option><option>Both</option></select></label><div class="actions"><button>Add party</button><button type="button" id="partyclose" class="alt">Cancel</button></div></form></dialog><script src="app.js?v=4"></script></body></html>
