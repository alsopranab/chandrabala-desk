<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b2a"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Chandrabala Desk</title></head><body><aside><img src="assets/logo.svg" width="42"><div><b>CHANDRABALA</b><small>RUBBER INDUSTRIES</small></div><nav><button data-view="home">Overview</button><button data-view="sales">Sales & invoices</button><button data-view="purchase">Purchases</button><button data-view="stock">Inventory</button><button data-view="parties">Parties</button><button data-view="settings">Settings</button></nav></aside><main><header><h1 id="heading">Overview</h1><button id="new">+ New transaction</button></header><div id="app"></div></main><dialog id="dlg"><form id="form"><h2>New transaction</h2><label>Type<select name="type"><option value="sale">Sale</option><option value="purchase">Purchase</option></select></label><label>Date<input type="date" name="date" required></label><label>Party<input name="party" required></label><label>Grade<select name="grade"><option>RSS 4</option><option>RSS 5</option><option>Dry Lot</option><option>Good Lot</option><option>Washing Lot</option></select></label><label>Quantity (kg)<input type="number" step=".01" min=".01" name="qty" required></label><label>Rate ₹/kg<input type="number" step=".01" min="0" name="rate" required></label><label>GST %<select name="gst"><option>0</option><option>5</option><option>12</option><option>18</option></select></label><label>Notes<input name="notes"></label><p id="calc">Total: ₹0.00</p><button type="submit">Save</button><button type="button" id="close">Cancel</button></form></dialog><script src="app.js"></script></body></html>
